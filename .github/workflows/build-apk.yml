name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android platform
        run: npx cap add android 2>/dev/null || echo "Android platform already added"

      - name: Inject custom SMS plugin into Android project
        run: |
          PLUGIN_DIR="android/app/src/main/java/com/ledger/app"
          mkdir -p "$PLUGIN_DIR"
          cp SmsPlugin.java "$PLUGIN_DIR/SmsPlugin.java"
          cp MainActivity.java "$PLUGIN_DIR/MainActivity.java"

      - name: Add READ_SMS permission to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_SMS" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.READ_SMS" />\n    <application|' "$MANIFEST"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ledger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK info
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          echo "Build succeeded"
          echo "APK size: $(du -sh $APK | cut -f1)"
          echo "Path: $APK"
